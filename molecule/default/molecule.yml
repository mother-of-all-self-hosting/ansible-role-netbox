---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: netbox-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        netbox_debug_service_enabled: false

        # Variables for NetBox
        netbox_uid: 1000
        netbox_gid: 1000
        netbox_scheme: http
        netbox_hostname: localhost
        netbox_container_labels_traefik_enabled: false
        netbox_container_http_host_bind_port: 8080
        netbox_environment_variable_secret_key: randoma2x9Gl6es8hWwhyMSD4M81QCR4BJxQdyoEqCtaw1w7EYTdjYGcJvztBcHj
        netbox_environment_variable_redis_cache_hostname: "{{ valkey_identifier }}"
        netbox_environment_variable_superuser_name: root
        netbox_environment_variable_superuser_email: example@example.com
        netbox_environment_variable_superuser_password: password
        netbox_environment_variables_additional_variables: |
          DB_WAIT_DEBUG=1

        # Variables required for NetBox to connect to the Postgres database
        netbox_database_hostname: "{{ postgres_connection_hostname }}"
        netbox_database_port: "{{ postgres_connection_port }}"
        netbox_database_username: my_database_username
        netbox_database_password: my_database_password
        netbox_database_name: netbox
        netbox_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}

        # Variables required for NetBox to connect to the Valkey data-store
        netbox_redis_hostname: "{{ valkey_identifier }}"
        netbox_container_additional_networks_custom:
          - "{{ valkey_container_network }}"
        netbox_systemd_required_services_list_custom:
          - "{{ valkey_identifier }}.service"

        # Variables for Postgres
        postgres_uid: 1000
        postgres_gid: 1000
        postgres_connection_password: postgres_password
        postgres_container_network: "{{ netbox_container_network }}"
        postgres_managed_databases: |
          {{
            [{
              'name': netbox_database_name,
              'username': netbox_database_username,
              'password': netbox_database_password,
            }]
          }}

        # Variables for Valkey
        valkey_uid: 1000
        valkey_gid: 1000
        valkey_arch: amd64
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgres
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
